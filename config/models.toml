# Model metadata overrides and tier defaults (§11.4, §6).
#
# Mixroute's GET /models returns IDs only, so names, prices, context windows and
# capabilities come from this file. Models seeded here but missing from the live list
# are hidden; live models not seeded here are shown with unknown metadata.
#
# Prices: USD per 1M tokens, from the Mixroute catalogue (https://mixroute.ai/models/),
# checked 2026-10-18. The catalogue lists IDs as slugs (dots become dashes, e.g.
# `gemini-3-5-flash-lite` is the API ID `gemini-3.5-flash-lite`). A price that could not be
# confirmed there is omitted and shown as "Price unknown" — never guessed.
# Context windows: Mixroute docs where listed, otherwise the vendor's documentation.
# `free = true` only for models confirmed zero-priced AND present in GET /models.
# `rank`: lower = shown earlier in the home Models row (most capable and popular first).

[defaults]
chat_model = "mixroute:gpt-4.1-nano"
title_model = "mixroute:gpt-4.1-nano"

# Agent model tiers (§6), used from Phase A. T0 is deterministic replay (no model).
[tiers]
t1 = ["mixroute:gpt-4.1-nano", "mixroute:gpt-5-nano"]
t2 = ["mixroute:gpt-4.1-mini", "mixroute:gemini-2.5-flash", "mixroute:gpt-5-mini"]
t3 = ["mixroute:gpt-5", "mixroute:gpt-4.1"]

