# Hand-maintained model configuration (§11.4, §6). Layered over
# config/models.generated.json, which scripts/sync-models.mjs builds from Mixroute's public
# catalogue (names, vendors, modalities, context, prices, endpoints, capabilities).
#
# The model list itself is whatever Mixroute's GET /models returns for your key (cached 24 h);
# a model missing from both files still appears, with "Price unknown". Values here override
# the generated catalogue where something was verified live through Mixroute (see
# DECISIONS.md D12) or is documented by the vendor. Never put a guessed value here.

[defaults]
chat_model = "mixroute:gpt-4.1-nano"
title_model = "mixroute:gpt-4.1-nano"

# Agent model tiers (§6), used from Phase A. T0 is deterministic replay (no model).
[tiers]
t1 = ["mixroute:gpt-4.1-nano", "mixroute:gpt-5-nano"]
t2 = ["mixroute:gpt-4.1-mini", "mixroute:gemini-3.5-flash-lite"]
t3 = ["mixroute:gpt-4.1", "mixroute:gemini-2.5-flash"]

# Current flagship models of each provider in Mixroute's catalogue (2026-10-18). They are
# listed first everywhere, by output price. Mixroute lists no Mistral models.
[frontier]
models = [
  "claude-fable-5-1",
  "claude-opus-5-5",
  "claude-sonnet-5-5",
  "gpt-6-astra",
  "gpt-6.1-sol",
  "gpt-6-sol",
  "gemini-4-argon",
  "grok-4.7",
  "kimi-k3",
  "qwen3.8-max",
  "deepseek-v4-pro",
  "glm-5.3",
  "MiniMax-M3",
  "command-a-plus-05-2026",
  "mimo-v2.5-pro",
  "hy4-preview",
  "llama-4-maverick-17b-128e-instruct-fp8",
]

# Shown when Mixroute has never been reached (no key yet, offline): the IDs GET /models
# returned for this account on 2026-10-18. Replaced by the live list as soon as it loads.
[fallback]
models = [
  "MiniMax-M2.5", "deepseek-v4-flash", "gemini-2.5-flash", "gemini-2.5-flash-image",
  "gemini-3.5-flash-lite", "gpt-4.1", "gpt-4.1-2025-04-14", "gpt-4.1-mini",
  "gpt-4.1-mini-2025-04-14", "gpt-4.1-nano", "gpt-4.1-nano-2025-04-14", "gpt-4o-2024-08-06",
  "gpt-4o-2024-11-20", "gpt-4o-mini", "gpt-4o-mini-2024-07-18", "gpt-5", "gpt-5-2025-08-07",
  "gpt-5-mini", "gpt-5-mini-2025-08-07", "gpt-5-nano", "gpt-5-nano-2025-08-07", "kimi-k2.5",
  "qwen3.6-flash",
]

# --- Overrides ------------------------------------------------------------------------
# Verified live through Mixroute (D12): image parts are dropped for these models.
[[overrides]]
id = "gpt-4.1-nano"
vision = false
structured_output = false

[[overrides]]
id = "gpt-4.1-mini"
vision = false
structured_output = false

[[overrides]]
id = "gpt-5-nano"
vision = false
structured_output = false
reasoning = true

# Verified live (D12): strict json_schema fails for OpenAI models through Mixroute.
[[overrides]]
id = "gpt-4.1"
structured_output = false

[[overrides]]
id = "gpt-4o-mini"
structured_output = false

[[overrides]]
id = "gpt-4o-2024-11-20"
structured_output = false

[[overrides]]
id = "gpt-4o-2024-08-06"
structured_output = false

[[overrides]]
id = "gpt-5"
structured_output = false

[[overrides]]
id = "gpt-5-mini"
structured_output = false
reasoning = true

# Reasoning ("thinking") models per Mixroute's docs and the vendors' documentation.
[[overrides]]
id = "gemini-2.5-flash"
reasoning = true

[[overrides]]
id = "deepseek-v4-flash"
reasoning = true

[[overrides]]
id = "kimi-k2.5"
reasoning = true
