# Tauri app crate: window setup, commands, events and wiring only (§1.1).
[package]
name = "machi"
description = "Machi desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
# Desktop only: the mobile crate types (staticlib/cdylib) are not built.
name = "machi_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
machi-core = { workspace = true }
machi-platform = { workspace = true }
tauri = { version = "2", features = ["specta"] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
specta = { workspace = true }
tauri-specta = { workspace = true }
specta-typescript = { workspace = true }

[lints]
workspace = true
